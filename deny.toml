# cargo-deny config — used by CI's `audit` job. Keep small: only the gates
# we actually want enforced. `vulnerability = "deny"` is the hard fail;
# `unmaintained` and `yanked` are warnings so a single yanked transitive
# dep doesn't block unrelated PRs.

[advisories]
version = 2
yanked = "warn"
ignore = []

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "Zlib",
    "MPL-2.0",
    "OpenSSL",
    "BSL-1.0",
    "Unlicense",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "warn"
unknown-git = "allow"
