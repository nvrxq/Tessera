[package]
name = "tessera"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "tessera_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# default empty so `cargo run` / debug builds still use the vite dev server.
# release builds must pass `--features custom-protocol` (or use a CARGO alias) to
# tell Tauri to serve the embedded frontendDist instead of devUrl.
default = []
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
tessera-core = { path = "../crates/core" }
tessera-store = { path = "../crates/store" }
tessera-git = { path = "../crates/git" }
tessera-pty = { path = "../crates/pty" }
tessera-workspace = { path = "../crates/workspace" }
tessera-hook = { path = "../crates/hook" }
tessera-term = { path = "../crates/term" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
chrono.workspace = true
base64 = "0.22"
dirs = "5"
rusqlite = { version = "0.34", features = ["bundled"] }
libc = "0.2"
raw-window-handle = "0.6"
