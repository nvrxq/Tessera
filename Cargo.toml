[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/store",
    "crates/git",
    "crates/pty",
    "crates/workspace",
    "crates/hook",
    "crates/overlay",
    "crates/render",
    "crates/term",
    "src-tauri",
]

[workspace.package]
version = "0.1.3"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/nvrxq/Tessera"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"

# Trim build artifacts: dev keeps fast incremental builds but skips full
# debuginfo (cuts target/ size ~40-50%); release strips symbols and runs
# thin LTO for a small, distributable binary.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
panic = "abort"
