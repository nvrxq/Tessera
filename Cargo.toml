[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/store",
    "crates/git",
    "crates/pty",
    "crates/workspace",
    "crates/hook",
    "crates/term",
    "src-tauri",
]

[workspace.package]
version = "0.1.15"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/nvrxq/Tessera"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"

# Trim build artifacts: dev keeps fast incremental builds but skips full
# debuginfo (cuts target/ size ~40-50%); release strips symbols and runs
# thin LTO for a small, distributable binary.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.release]
strip = "symbols"
# Build-speed tuning: dropped `lto = thin` (~30s saved on macOS-14) and
# bumped codegen-units from 1 to 16 (parallel codegen, ~2 min saved on
# cold builds). Trade-off is ~30% larger binary (12-14 MB → 16-18 MB),
# which is fine for a desktop app downloaded once and auto-updated in
# the background. `dist` profile below remains the tight-size build for
# any future "ship a small binary" need.
lto = false
codegen-units = 16
panic = "abort"

[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1
