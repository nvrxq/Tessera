name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Only Apple Silicon — free macos-13 (Intel) runners queue 10-20
          # minutes routinely. Apple Silicon Mac coverage = "all Macs since
          # 2020". Friends on Intel Macs can build from source.
          - platform: macos-14
            target: aarch64-apple-darwin
            label: macos-arm64
          - platform: ubuntu-24.04
            target: ''
            label: linux-x64
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: install linux deps (tauri)
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@1.88

      - name: add rust target
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.x

      - name: install ui deps
        working-directory: ui
        run: bun install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Tessera ${{ github.ref_name }}'
          releaseBody: 'Auto-built release. Install via the one-liner in the README, or grab the asset for your platform below. macOS builds are not Apple-notarised — strip Gatekeeper quarantine with `xattr -dr com.apple.quarantine /Applications/Tessera.app` if needed.'
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.target != '' && format('--target {0}', matrix.target) || '' }}
