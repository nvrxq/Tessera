name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: install system deps (tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            patchelf
      - uses: dtolnay/rust-toolchain@1.88
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace --all-targets

  ui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.x
      - name: install
        working-directory: ui
        run: bun install --frozen-lockfile
      - name: test
        working-directory: ui
        run: bun run test
      - name: build
        working-directory: ui
        run: bun run build

  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # `rustsec/audit-check` only needs Cargo.lock; we don't need rustup.
      - name: cargo audit (RustSec advisories)
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      # cargo-deny enforces the deny.toml license allow-list + advisory
      # policy. `check advisories licenses` covers what we care about
      # without the heavier bans/sources sections.
      - name: cargo deny (advisories + licenses)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses
